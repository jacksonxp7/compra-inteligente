<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartMarket Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-bar">
        <div class="brand">💎 Smart<span>Market</span></div>
        <a href="dashboard.html" class="btn-dash"><i class="fas fa-chart-line"></i> Dashboard</a>
    </header>

    <main class="content">
        <!-- ABA: LISTA ATIVA -->
        <section id="aba-lista" class="tab-content active">
            <div class="card add-form">
                <!-- O datalist 'sugestoes' será preenchido pelo JS -->
                <input type="text" id="nome-item" list="sugestoes" placeholder="O que comprar?">
                <datalist id="sugestoes"></datalist>
                
                <div class="input-row">
                    <select id="categoria-item">
                        <option value="Alimentos">🍎 Alimentos</option>
                        <option value="Limpeza">🧼 Limpeza</option>
                        <option value="Higiene">🪥 Higiene</option>
                        <option value="Pet">🐾 Pet</option>
                        <option value="Bebidas">🥤 Bebidas</option>
                        <option value="Frios">🧀 Frios</option>
                        <option value="Outros">📦 Outros</option>
                    </select>
                    <input type="number" id="preco-item" placeholder="R$ 0,00" step="0.01">
                    <input type="number" id="qtd-item" value="1" min="1">
                    <button id="btn-adicionar"><i class="fas fa-plus"></i></button>
                </div>
            </div>

            <div id="lista-render" class="list-area"></div>

            <div class="summary-fixed">
                <div class="total-box">
                    <small>TOTAL ESTIMADO</small>
                    <h2 id="total-geral">R$ 0,00</h2>
                </div>
                <button onclick="finalizarCompra()" class="btn-finish">Fechar Mês</button>
            </div>
        </section>

        <!-- ABA: HISTÓRICO RÁPIDO -->
        <section id="aba-historico" class="tab-content">
            <div class="card" style="text-align:center; padding: 30px;">
                <i class="fas fa-history" style="font-size:3rem; color:var(--primary); margin-bottom:15px"></i>
                <h3>Histórico Completo</h3>
                <p>Para comparar meses lado a lado e ver detalhes antigos:</p>
                <br>
                <a href="historico.html" class="btn-finish" style="text-decoration:none; display:block">Abrir Aba de Histórico</a>
            </div>
        </section>

        <!-- ABA: CONFIGURAÇÕES -->
        <section id="aba-config" class="tab-content">
            <!-- O JS injetará o conteúdo aqui -->
        </section>
    </main>

    <nav class="bottom-tabs">
        <button class="tab-btn active" onclick="switchTab('lista', event)"><i class="fas fa-shopping-basket"></i><span>Lista</span></button>
        <button class="tab-btn" onclick="switchTab('historico', event)"><i class="fas fa-calendar-alt"></i><span>Histórico</span></button>
        <button class="tab-btn" onclick="switchTab('config', event)"><i class="fas fa-cog"></i><span>Ajustes</span></button>
    </nav>

    <!-- ORDEM IMPORTANTE DOS SCRIPTS -->
    <script src="configuracoes.js"></script>
    <script src="app.js"></script>
</body>
</html>
